agent:
  display_name: "Video to H3 Prompt"
  short_description: "Forensically reverse-engineer a reference video into a ready-to-paste MiniMax H3 prompt (T2VA/I2VA/FL2VA/L2VA/Ref2VA) via dense frame sampling, music onset/card-point sync, causal event-chain reconstruction, film-type to camera-state-machine triage (continuous / snap-lock / multi-shot montage), freeze-frame and glitch effects, multi-image character locking, long-clip segmentation, and coser replacement without plot change."
  default_prompt: "Analyze the attached video and produce a complete MiniMax H3 prompt. Run the forensics (sparse grid + dense 4-8fps transition frames, spectrogram, RMS/BPM credibility, and onset/card-point detection), reconcile every cut/freeze/impact against strong music onsets, triage the film type into continuous-take / editorial snap-lock / multi-shot montage and use the matching camera state machine, build a causal shot-by-shot event chain with named camera setups and angles, separate live action / camera / edit-effects / sound layers, then choose the H3 mode and assemble every required field. If reference images are supplied, lock each character's identity/costume from its picture and keep appearance prose out while defining environment/props in text; split clips over ~15s into segments with per-segment clocks, non-restarting music and hand-off states. If a coser/character swap is requested, change appearance only and append a replacement table. Print the final ready-to-paste English prompt block in the reply; save a .md only if file delivery is explicitly requested."
